<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            display:inline-block;
            margin: 20px;
        }
        
        #a{
            border-top-left-radius:80px ;
            background-color:rgb(235, 154, 167);
        }
        #e{
            border-top-right-radius: 80px;
            background-color:rgb(235, 154, 167);
        }
        #b{
            border-radius: 10px;
            background-color: skyblue;
        }
        #c{
            border-radius: 1px;
            background-color: rgb(183, 144, 183);
        }
        #d{
            border-top-left-radius: 40px;
            border-bottom-right-radius: 40px;
            background-color: rgb(104, 215, 104);
        }
        #f{
            border-radius: 30px;
            background-color: skyblue;
        }
        #g{
            border-radius: 20px;
            background-color: rgb(183, 144, 183);
        }
        #h{
            border-top-left-radius: 60px;
            border-bottom-right-radius: 60px;
            background-color: rgb(104, 215, 104);
        }
        #i{
            border-bottom-right-radius: 80px;
            background-color:rgb(235, 154, 167);
        }
        #j{
            border-radius: 70px;
            background-color: skyblue;
        }
        #k{
            border-radius: 35px;
            background-color: rgb(183, 144, 183);
        }
        #l{
            border-top-left-radius: 160px;
            border-bottom-right-radius:160px;
            background-color: rgb(104, 215, 104);
        }
        #m{
            border-bottom-left-radius: 80px;
            background-color:rgb(235, 154, 167);
        }
        #n{
            border-radius: 100px;
            background-color: skyblue;
        }
        #o{
            border-radius: 100px;
            background-color: rgb(183, 144, 183);
        }
        #p{
            border-top-left-radius: 200px;
            border-bottom-right-radius:200px;
            background-color: rgb(104, 215, 104);
        }
    </style>

</head>
<body>
    <div id="item">
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
        <div id="d"></div>
    </div>
    <div id="rounded square">
        <div id="e"></div>
        <div id="f"></div>
        <div id="g"></div>
        <div id="h"></div>
    </div>
    <div id="square">
        <div id="i"></div>
        <div id="j"></div>
        <div id="k"></div>
        <div id="l"></div>
    </div>
    <div id="leaf">
        <div id="m"></div>
        <div id="n"></div>
        <div id="o"></div>
        <div id="p"></div>
    </div>
</body>
</html>
