<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 600px;
            width: 900px;
            margin: 20px 20px 20px 20px;
            display:flex ;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .child1{
            height: 600px;
            width: 400px;
            background-color: rgb(0, 119, 255);
            border: 2px solid;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
            text-align: left;
        }
        #a{
            font-size: 24px;
            line-height: 20px;
        }
        .child2{
            height: 600px;
            width:500px;
            background-color: white;
            box-shadow: 0px 2px 10px rgba(0,0,0,.2) ;
            padding: 20px;
            border: none;
        }
        input{
            outline: none;
            border: none;
            border-bottom: 2px solid blue;
            width: 100%;
            padding: 10px;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .text{
            color: gray;
            font-size: 14px;
        }
        button{
            height: 50px;
            width: 100%;
            background-color: rgb(251, 113, 1);
            color: white;
            border: none;
            font-size: 16px;
        }
        #new_page{
            height: 10%;
            width:100%;
            box-shadow: 0px 2px 10px rgba(0,0,0,.2);
            background-color: white;
            color: blue;
            border: none;
            font-size: 16px;
            margin-top: 10px;
        }
        
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1">
            <div>
            <h1>Looks like you're <br>new here!</h1>
            <p id="a">Sign up with your mobile number <br><br> to get started</p>
            </div>
            <img src="./login_img_c4a81e.png" alt="">
        </div>
        <div class="child2">
            <br><br>
            <input type="text" name="" id="" placeholder="Enter Mobile number" required>
            <p class="text">
                By continuing, you agree to Flipkart's
                <a href="#">Terms of use </a>and 
                <a href="#">Privacy  policy.</a>
            </p>
            <button>CONTINUE</button>
            <br>
            <a href="./flipkrt.html">
            <button id="new_page">Existing User?Log in </button>
            </a>
        </div>
    </div>
</body>
</html>
