<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right,#a445b2,#fa4299);
}
.box{
    width:380px;
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
}
h1{
    margin-bottom:25px;
}
.btn{
    display:flex;
    margin-bottom:20px;
}
.btn button{
    width:50%;
    padding:12px;
    border:1px solid #ccc;
    background:white;
    font-size:18px;
    cursor:pointer;
}
.login{
    background:linear-gradient(to right,#a445b2,#fa4299);
    color:white;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}
a{
    color:#fa4299;
    text-decoration:none;
    display:block;
    text-align:left;
    margin:10px 0;
}
.login-btn{
    width:100%;
    padding:12px;
    background:linear-gradient(to right,#a445b2,#fa4299);
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}
p{
    margin-top:20px;
}
    </style>
</head>
<body>
    <div class="box">
    <h1>Login Form</h1>

    <div class="btn">
        <button class="login">Login</button>
        <button>Signup</button>
    </div>
    <input type="email" placeholder="Email Address">
    <input type="password" placeholder="Password">
    <a href="#">Forgot password?</a>
    <button class="login-btn">Login</button>
    <p>Not a member? <a href="#">Signup now</a></p>
</div>
   
</body>
</html>
