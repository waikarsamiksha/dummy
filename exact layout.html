<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    padding:20px;
    background:#f5f5f5;
}

.container{
    width:900px;
    display:grid;
    grid-template-columns:180px 180px 180px 180px;
    grid-template-rows:120px 160px 160px;
    gap:10px;
}

.box{
    background:red;
    color:black;
    font-size:25px;
    padding:10px;
}

/* Box Positions */

.box1{
    grid-row:1 / 3;
}

.box2{
    grid-column:2 / 3;
}

.box3{
    grid-column:3 / 5;
}

.box4{
    grid-column:2 / 3;
    grid-row:2 / 3;
}

.box5{
    grid-column:3 / 4;
    grid-row:2 / 3;
}

.box6{
    grid-column:4 / 5;
    grid-row:2 / 4;
}

.box7{
    grid-column:1 / 2;
    grid-row:3 / 4;
}
.box8{
    grid-column:3 / 4;
    grid-row:3 / 4;
}
.box9{
    grid-column:2 / 3;
    grid-row:3 / 4;
}
    </style>
</head>
<body>
    <div class="container">
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>
    <div class="box box4">box4</div>
    <div class="box box5">box5</div>
    <div class="box box6">box6</div>
    <div class="box box7">box7</div>
    <div class="box box8">box8</div>
    <div class="box box9">box9</div>
</div>
</body>
</html>
