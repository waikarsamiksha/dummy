<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#aee5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    width:700px;
    background:#d9f2ff;
    padding:40px;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}
.circle{
    width:250px;
    height:250px;
    background:#6f8df7;
    border-radius:50%;
    position:absolute;
    top:-120px;
    right:-120px;
}
.profile{
    width:140px;
    height:140px;
    border-radius:50%;
    border:5px solid white;
}
h1{
    margin-top:20px;
}
h3{
    color:#555;
    margin-bottom:20px;
}
p{
    width:450px;
    line-height:30px;
    margin-bottom:30px;
}
.details{
    display:flex;
    gap:70px;
    margin-bottom:30px;
}
.details h2{
    font-size:35px;
}
.details span{
    font-size:20px;
    font-weight:bold;
}
button{
    width:170px;
    height:55px;
    font-size:22px;
    border-radius:10px;
    cursor:pointer;
}
.follow{
    background:black;
    color:white;
    border:none;
}
.profilebtn{
    background:white;
    border:2px solid black;
    margin-left:20px;
}
    </style>
</head>
<body>
    <div class="card">
    <div class="circle"></div>
    <img src="./cat.jpg" class="profile">
    <h1>Bradley Steve</h1>
    <h3>@bradsteve</h3>
    <p>
        I'm a Front End Developer, follow me to be the
        first who see my new work.
    </p>
    <div class="details">
        <div>
            <h2>15K</h2>
            <span>Views</span>
        </div>
        <div>
            <h2>82</h2>
            <span>Projects</span>
        </div>
        <div>
            <h2>1.3M</h2>
            <span>Followers</span>
        </div>
    </div>
    <button class="follow">Follow</button>
    <button class="profilebtn">View Profile</button>
</div>
</body>
</html>
