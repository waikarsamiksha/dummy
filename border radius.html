<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 300px;
            width: 300px;
            margin: 20px;
            border: 1px solid;
            display: inline-block;
        }
        #a{
            border-top-right-radius:220px ;
            border-bottom-left-radius: 220px;
            background-color: rgb(131, 202, 232);
        }
        #b{
            border-bottom-left-radius: 180px;
            border-bottom-right-radius:180px;
            height: 200px;
            width: 360px;
            background-color: blue;
        }
        #c{
            border-radius: 50%;
            height: 200px;
            width: 320px;
            background-color: orange;
        }
        #d{
            height: 250px;
            width: 400px;
            background-color: green;
            border-top-right-radius: 200%;
            border-bottom-left-radius:200%;
        }
        #e{
            height: 300px;
            width: 500px;
            border-radius:0 150px 0 150px;
            background-color: purple;
        }
        #f{
            border-radius: 360px;
            background-color: rgb(244, 97, 121);
        }
        #g{
            height: 280px;
            width: 250px;
            background-color:rgb(84, 169, 202);
            border-bottom-left-radius: 180px;
            border-bottom-right-radius: 180px ;
        }
        #h{
            border-top-right-radius: 180px;
            border-bottom-left-radius: 180px;
            border-bottom-right-radius: 180px;
            background-color: rgb(2, 2, 143);


        }
        
    </style>
</head>
<body>
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
        <div id="d"></div>
        <div id="e"></div>
        <div id="f"></div>
        <div id="g"></div>
        <div id="h"></div>
</body>
</html>
