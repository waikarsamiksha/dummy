<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="">
        <label for="">Enter your name:*</label>
        <input type="text" name="" id="" required>
        <br><br>
        <label for="">Enter Email address:*</label>
        <input type="email" name="" id="" required>
        <br><br>
        <input type="tel" name="" id="" placeholder="Enter mobile number">
        <br><br>
        <label for="">DOB:</label>
        <input type="date" name="" id="" required>
        <br><br>
        <label for="">Select gender:</label>
        <input type="radio" name="gender" id=""><label for="">Male</label>
        <input type="radio" name="gender" id=""><label for="">female</label>
        <input type="radio" name="gender" id=""><label for="">other</label>
        <br><br>
        <label for="">select subject:</label>
        <input type="checkbox" name="" id=""><label for="">Maths</label>
        <input type="checkbox" name="" id=""><label for="">Science</label>
        <input type="checkbox" name="" id=""><label for="">Marathi</label>
        <input type="checkbox" name="" id=""><label for="">English</label>
        <br><br>
        <label for="">Upload Documents</label>
        <input type="file" name="" id="" accept=".pdf">
        <br><br>
        <input type="submit" value="SUBMIT">

    </form>
</body>
</html>
